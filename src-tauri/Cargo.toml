[package]
name = "deskseek"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deskseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The kill switch: a hotkey that stops every run, including one that has taken
# over the mouse and keyboard.
tauri-plugin-global-shortcut = "2"
# OS toasts, for a run that finished while the user was looking elsewhere. Called
# from Rust only, so no webview permission is needed for it.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync", "fs"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Data URLs for files read on the Rust side: a native drop hands the webview a
# path, not a File, and the webview cannot read the disk itself. Already in the
# tree, so it costs no new build.
base64 = "0.22"
# `HeaderName`/`HeaderValue` for MCP custom headers. Already in the tree
# transitively (reqwest and rmcp both use it), so a direct line costs no build.
http = "1"
tauri-plugin-dialog = "2.8.2"
# MCP client. Both transports: a child process over stdio, and a streamable-HTTP
# endpoint for a remote server. `reqwest-native-tls` keeps rmcp's HTTP client on
# the same schannel backend as our own reqwest; the rustls default needs
# NASM/cmake on Windows.
rmcp = { version = "3.5.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "which-command",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
notify = "8.2.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
docx-rs = { version = "0.4.22", default-features = false }
# ponytail: default features on, though we only write .pptx. The crate's own
# build is broken without `pdf-native` (it imports `pdfrs` unconditionally from
# export/slide_render.rs), so `--no-default-features` does not compile. The PDF
# path is never called from here.
ppt-rs = "0.2.27"
rust_xlsxwriter = "0.99.1"

# Secret storage in the OS keychain, one native store per platform.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Reading the desktop's accessibility tree. `input` is a hard requirement of the
# crate's `control` feature, but nothing in this build *calls* it: the tools
# exposed can look, not touch. Acting arrives with the kill switch it needs.
uiautomation = { version = "0.25", default-features = false, features = ["control", "input", "pattern"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
