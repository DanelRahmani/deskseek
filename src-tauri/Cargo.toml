[package]
name = "deskseek"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deskseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# The kill switch: a hotkey that stops every run, including one that has taken
# over the mouse and keyboard.
tauri-plugin-global-shortcut = "2"
# OS toasts, for a run that finished while the user was looking elsewhere. Called
# from Rust only, so no webview permission is needed for it.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync", "fs"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Data URLs for files read on the Rust side: a native drop hands the webview a
# path, not a File, and the webview cannot read the disk itself. Already in the
# tree, so it costs no new build.
base64 = "0.22"
# `HeaderName`/`HeaderValue` for MCP custom headers. Already in the tree
# transitively (reqwest and rmcp both use it), so a direct line costs no build.
http = "1"
tauri-plugin-dialog = "2.8.2"
# MCP client. Both transports: a child process over stdio, and a streamable-HTTP
# endpoint for a remote server. `reqwest-native-tls` keeps rmcp's HTTP client on
# the same schannel backend as our own reqwest; the rustls default needs
# NASM/cmake on Windows.
rmcp = { version = "3.5.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "which-command",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
notify = "8.2.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
docx-rs = { version = "0.4.22", default-features = false }
# ponytail: default features on, though we only write .pptx. The crate's own
# build is broken without `pdf-native` (it imports `pdfrs` unconditionally from
# export/slide_render.rs), so `--no-default-features` does not compile. The PDF
# path is never called from here.
ppt-rs = "0.2.27"
rust_xlsxwriter = "0.99.1"
# Reading those same containers back (tools/extract.rs). Both are already in the
# tree — `zip` 8 via docx-rs and rust_xlsxwriter, `quick-xml` 0.41 via docx-rs —
# so declaring them adds no crate to the build, *provided the features match the
# ones those two already asked for*. `zip`'s defaults pull in AES, bzip2, lzma,
# zstd and ppmd, none of which an Office file needs: it is a ZIP of DEFLATE'd
# XML, so `deflate` is the whole requirement. The version is pinned to the one
# already resolved on purpose — a wider range would resolve to a second copy.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", default-features = false, features = ["encoding"] }
# A PDF is not a ZIP of XML we can walk, so this one is a real new dependency.
# MIT, no build script, no network, no C.
pdf-extract = "0.12"
# PNG encoding, for the Appshot (tools/desktop.rs). Already resolved in the build
# graph through `tauri-codegen`'s icon handling, so declaring it adds no crate to
# the lock file — only the ability to write one.
png = "0.18"

# Secret storage in the OS keychain, one native store per platform.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The job object that takes every child process with it when DeskSeek dies, so a
# killed app cannot leave a build running invisibly (tools/job.rs). Already in
# the tree transitively, so a direct line adds no crate to the build — only the
# feature flags below. Pinned to the version already resolved on purpose: a wider
# range would resolve to a second copy of it.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # `SendInput`, for the one computer-use action that has no control to invoke:
    # a click at a pixel in the picture the model was shown (tools/desktop.rs).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# Reading the desktop's accessibility tree. `input` is a hard requirement of the
# crate's `control` feature, but nothing in this build *calls* it: the tools
# exposed can look, not touch. Acting arrives with the kill switch it needs.
uiautomation = { version = "0.25", default-features = false, features = ["control", "input", "pattern"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
