name: Release

on:
  # A tag is the release's identity: v1.2.3 is created once and the installers
  # hang off it. Pushing one is the normal path.
  push:
    tags: ["v*"]
  # A manual run has no tag to read. Without being told one, this fell back to
  # github.ref_name — "main" on a branching push — and asked GitHub to create a
  # release tagged main.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true
        type: string

# The automatic GITHUB_TOKEN is read-only in this repository
# (default_workflow_permissions: read), and creating a release is a write. The
# build succeeded and only the last step failed with "Resource not accessible by
# integration" — this is the line that grants it.
permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build installers and draft a release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "DeskSeek ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below for installers. Windows is the tested target."
          releaseDraft: true
          prerelease: false
